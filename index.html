.pied .infos{margin-bottom:1.2rem}
.pied .infos p{font-size:.92rem}
.pied .infos a{color:var(--laiton);text-decoration:none;border-bottom:1px solid var(--trait)}
.mention{font-size:.78rem;color:var(--fumee);max-width:26rem;margin:0 auto;line-height:1.6}
.compteur{
  margin-top:1.4rem;padding:0 2.6rem;min-height:30px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(163,143,120,.6)
}
.compteur[hidden]{display:none}
.compteur b{color:var(--laiton);font-weight:500;font-variant-numeric:tabular-nums}
.jeton{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* Petit ours discret : un appui dessus révèle le nombre de visites */
.jeton{
  position:absolute;left:0;bottom:0;
  width:30px;height:30px;padding:0;border:none;border-radius:50%;
  background:#0B0906 center/cover no-repeat;
  opacity:.3;cursor:pointer;transition:opacity .3s
}
.jeton:hover,.jeton:focus-visible{opacity:.75}

a:focus-visible{outline:2px solid var(--laiton);outline-offset:3px}

/* ─── Apparition douce ─── */
.section{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.section.vue{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .section{opacity:1;transform:none;transition:none}
  .scene{animation:none}
}

/* ─── Impression : bascule en version papier ─── */
@media print{
  body{background:#fff;color:#111}
  body::before,.barre,.vignette,.arbre,.scene,.resultat,.coeur,.classement,.invitation{display:none}
  .ardoise{break-inside:avoid}
  .chapeau{padding:0 0 .8rem}
  .socle{padding:0 0 1rem}
  .enseigne{color:#111}
  .ecusson{width:56px;height:56px;box-shadow:none}
  .enveloppe{max-width:100%;padding:0}
  .section{opacity:1;transform:none;padding-top:1.4rem;break-inside:avoid}
  .plat-prix,.tag.suggestion,.bloc h3,.tarif .prix,.sceau,.eyebrow{color:#7a5310}
  .sceau{background:none}
  .plat-desc,.choix-desc{color:#8a6a2a}
  .condition,.mention,.notes p{color:#555}
  .coordonnees,.coordonnees a,.coordonnees .heures{color:#444;border:none}
  .compteur{display:none}
  .formule,.notes{background:#f6f2ea;border-color:#ddd}
}
</style>
</head>

<body>

<header class="banniere">
  <div class="chapeau">
    <img class="ecusson" id="logo" alt="Logo de La Tanière">
    <p class="eyebrow" id="eyebrow"></p>
  </div>
  <div class="scene">
    <div class="cliche" id="cliche"></div>
    <div class="voile"></div>
  </div>
  <div class="socle">
    <h1 class="enseigne" id="enseigne"></h1>
    <p class="sceau"><span class="point"></span><span id="maj"></span></p>
  </div>
</header>

<div class="enveloppe">
  <div class="coordonnees" id="coordonnees"></div>

  <div class="barre">
    <div class="recherche">
      <svg class="loupe" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
      </svg>
      <input id="recherche" type="search" placeholder="Rechercher un plat, un ingrédient…"
             autocomplete="off" aria-label="Rechercher dans la carte">
      <button class="vider" id="vider" type="button" aria-label="Effacer" hidden>&times;</button>
      <button class="filtre-btn" id="filtre-btn" type="button" aria-expanded="false">
        Filtres<span class="pastille" id="pastille" hidden></span>
      </button>
    </div>
    <nav class="nav" aria-label="Sections de la carte"><ul id="nav"></ul></nav>
    <div class="filtres" id="filtres" hidden></div>
  </div>

  <div class="ardoise" id="ardoise" hidden></div>

  <p class="resultat" id="resultat" hidden></p>
  <main id="carte"></main>
  <footer class="pied">
    <div class="infos" id="infos"></div>
    <p class="mention" id="mention"></p>
    <p class="compteur" id="compteur" hidden></p>
    <div class="classement" id="classement" hidden></div>
    <button class="jeton" id="jeton" type="button" aria-label="La Tanière"></button>
  </footer>
</div>

<script>
const normaliser = s => (s || "").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const e = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };

/* En-tête */
document.getElementById("logo").src = IMAGES.logo;
document.getElementById("cliche").style.backgroundImage = "url('" + IMAGES.banniere + "')";
document.getElementById("eyebrow").textContent = RESTO.eyebrow;
document.getElementById("enseigne").textContent = RESTO.nom;
document.getElementById("maj").textContent = dateDeMaj();

/* Date de mise à jour : celle du fichier lui-même, fournie par le serveur.
   Si l'information manque (fichier ouvert en local, par exemple), on affiche
   simplement « Carte à jour » plutôt qu'une date fausse. */
function dateDeMaj() {
  if (RESTO.maj && RESTO.maj !== "auto") return "Carte du " + RESTO.maj;

  const d = new Date(document.lastModified);
  if (isNaN(d)) return "Carte à jour";

  /* Sans en-tête Last-Modified, le navigateur renvoie l'heure courante :
     on l'écarte pour ne pas afficher la date du jour à tort. */
  if (Math.abs(Date.now() - d.getTime()) < 60000) return "Carte à jour";

  return "Carte du " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
}
document.title = RESTO.nom + " — La carte";

/* Un plat */
function rendrePlat(p) {
  const dispo = p.dispo !== false;
  const el = e("article", "plat" + (dispo ? "" : " indispo"));

  const ligne = e("div", "ligne");
  ligne.append(e("h3", "plat-nom", p.nom), e("span", "pointille"));
  if (p.prix) ligne.append(e("span", "plat-prix", p.prix + " €"));

  const coeur = e("button", "coeur");
  coeur.type = "button";
  coeur.dataset.plat = p.nom;
  coeur.title = "J'aime ce plat";
  coeur.setAttribute("aria-label", "J'aime : " + p.nom);
  coeur.setAttribute("aria-pressed", "false");
  coeur.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 20.5 4.2 12.9a4.6 4.6 0 0 1 0-6.6 4.8 4.8 0 0 1 6.7 0l1.1 1.1 1.1-1.1a4.8 4.8 0 0 1 6.7 0 4.6 4.6 0 0 1 0 6.6Z"/></svg>';
  ligne.append(coeur);

  el.append(ligne);

  if (p.desc) el.append(e("p", "plat-desc", p.desc));
  el.dataset.texte = normaliser([p.nom, p.desc, (p.tags || []).join(" ")].join(" "));
  const al = ALLERGENES[p.nom];
  el.dataset.allergenes = al ? al.join(" ") : "?";   // "?" = composition non renseignée

  const tags = (p.tags || []).slice();
  if (!dispo) tags.push("épuisé");
  if (tags.length) {
    const box = e("div", "etiquettes");
    tags.forEach(t => {
      const cls = t === "épuisé" ? "epuise" : t === "suggestion" ? "suggestion" : t === "nouveau" ? "nouveau" : "";
      box.append(e("span", "tag " + cls, t === "suggestion" ? "suggestion du chef" : t));
    });
    el.append(box);
  }
  return el;
}

/* Une section */
function rendreSection(s) {
  const sec = e("section", "section");
  sec.id = s.id;
  const th = e("div", "section-titre");
  th.append(e("h2", null, s.titre), e("span", "filet"));
  sec.append(th);
  (s.plats || []).forEach(p => sec.append(rendrePlat(p)));

  (s.groupes || []).forEach(g => {
    const box = e("div", "groupe");
    box.append(e("h3", null, g.titre));
    if (g.note) box.append(e("p", "groupe-note", g.note));
    g.plats.forEach(p => box.append(rendrePlat(p)));
    (g.notes || []).forEach(t => box.append(e("p", "groupe-pied", t)));
    sec.append(box);
  });

  if (s.notes && s.notes.length) {
    const n = e("div", "notes");
    s.notes.forEach(t => n.append(e("p", null, t)));
    sec.append(n);
  }
  return sec;
}

/* Une formule */
function rendreFormule(f) {
  const sec = e("section", "section");
  sec.id = f.id;
  const th = e("div", "section-titre");
  th.append(e("h2", null, f.titre), e("span", "filet"));
  sec.append(th);

  const box = e("div", "formule");
  if (f.condition) box.append(e("p", "condition", f.condition));

  const tarifs = e("div", "tarifs");
  f.tarifs.forEach(t => {
    const l = e("div", "tarif");
    l.append(e("span", "lbl", t.label), e("span", "pointille"), e("span", "prix", t.prix + " €"));
    tarifs.append(l);
  });
  box.append(tarifs);

  f.listes.forEach(b => {
    const bloc = e("div", "bloc");
    bloc.append(e("h3", null, b.titre));
    const ul = e("ul");
    b.choix.forEach(c => {
      const nom = typeof c === "string" ? c : c.nom;
      const li = e("li", null, nom);
      if (c.desc) li.append(e("span", "choix-desc", c.desc));
      li.dataset.texte = normaliser(nom + " " + (c.desc || ""));
      ul.append(li);
    });
    bloc.append(ul);
    box.append(bloc);
  });

  sec.append(box);
  return sec;
}

/* Assemblage */
const main = document.getElementById("carte");
const nav = document.getElementById("nav");
const toutes = [...CARTE.map(s => ({ id: s.id, titre: s.titre, el: rendreSection(s) })),
                ...FORMULES.map(f => ({ id: f.id, titre: f.titre, el: rendreFormule(f) }))]
  .sort((a, b) => {
    const ia = ORDRE.indexOf(a.id), ib = ORDRE.indexOf(b.id);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

toutes.forEach(s => {
  main.append(s.el);
  const li = e("li");
  const a = e("a", null, s.titre);
  a.href = "#" + s.id;
  li.append(a);
  nav.append(li);
});

/* Le pin en décor */
if (ARBRE.section && IMAGES.arbre) {
  const s = document.getElementById(ARBRE.section);
  if (s) {
    const a = e("img", "arbre");
    a.src = IMAGES.arbre; a.alt = ""; a.setAttribute("aria-hidden", "true");
    s.prepend(a);
  }
}

/* Plat du jour : affiché jusqu'à l'heure indiquée, puis masqué de lui-même */
(function platDuJour() {
  if (!PLAT_DU_JOUR.plat) return;

  const boite = document.getElementById("ardoise");

  function verifier() {
    const maintenant = new Date();
    /* On raisonne à l'heure de Paris, quel que soit le réglage du téléphone */
    const heure = Number(new Intl.DateTimeFormat("fr-FR", {
      timeZone: "Europe/Paris", hour: "numeric", hour12: false
    }).format(maintenant));

    boite.hidden = heure >= PLAT_DU_JOUR.jusqua;
  }

  boite.innerHTML = "";
  const eyebrow = e("p", "ardoise-titre", "Plat du jour");
  const nom = e("p", "ardoise-plat", PLAT_DU_JOUR.plat);
  boite.append(eyebrow, nom);
  if (PLAT_DU_JOUR.detail) boite.append(e("p", "ardoise-detail", PLAT_DU_JOUR.detail));

  const bas = e("p", "ardoise-bas");
  if (PLAT_DU_JOUR.mention) bas.append(e("span", null, PLAT_DU_JOUR.mention));
  if (PLAT_DU_JOUR.prix) {
    if (PLAT_DU_JOUR.mention) bas.append(e("span", "sep", " · "));
    bas.append(e("span", "ardoise-prix", PLAT_DU_JOUR.prix + " €"));
  }
  if (bas.childNodes.length) boite.append(bas);

  verifier();
  setInterval(verifier, 60000);            // contrôle chaque minute
  document.addEventListener("visibilitychange", verifier);
})();

/* Invitation à aimer les plats */
if (INVITATION.section) {
  const cible = document.getElementById(INVITATION.section);
  if (cible) {
    const mot = e("div", "invitation");
    mot.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M12 20.5 4.2 12.9a4.6 4.6 0 0 1 0-6.6 4.8 4.8 0 0 1 6.7 0l1.1 1.1 1.1-1.1a4.8 4.8 0 0 1 6.7 0 4.6 4.6 0 0 1 0 6.6Z"/></svg>';
    const bloc = e("div");
    bloc.append(e("p", "invitation-titre", INVITATION.titre),
                e("p", "invitation-texte", INVITATION.texte));
    mot.append(bloc);
    cible.querySelector(".section-titre").after(mot);
  }
}

/* Photos de plats */
PHOTOS_PLATS.forEach(bloc => {
  const cible = document.getElementById(bloc.section);
  if (cible) {
    const galerie = e("div", "galerie");
    bloc.images.forEach(p => {
      if (!IMAGES[p.cle]) return;
      const fig = e("figure", "plat-photo " + p.cote);
      fig.style.setProperty("--haut", p.haut);
      const img = e("img");
      img.src = IMAGES[p.cle];
      img.alt = p.legende;
      img.loading = "lazy";
      fig.append(img);
      if (p.legende) fig.append(e("figcaption", null, p.legende));
      galerie.append(fig);
    });
    cible.prepend(galerie);
  }
});

/* Photo de la salle */
if (VIGNETTE.apres && IMAGES.salle) {
  const cible = document.getElementById(VIGNETTE.apres);
  if (cible) {
    const fig = e("figure", "vignette");
    const img = e("img");
    img.src = IMAGES.salle;
    img.alt = "La salle du restaurant " + RESTO.nom;
    img.loading = "lazy";
    fig.append(img);
    if (VIGNETTE.legende) fig.append(e("figcaption", null, VIGNETTE.legende));
    cible.append(fig);
  }
}

/* Coordonnées sous la bannière */
const coord = document.getElementById("coordonnees");
const contact = e("div", "contact");
if (RESTO.adresse) {
  contact.append(e("span", null,
    '<a href="https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(RESTO.nom + " " + RESTO.adresse) + '" target="_blank" rel="noopener">' + RESTO.adresse + "</a>"));
}
if (RESTO.adresse && RESTO.telephone) contact.append(e("span", "sep", "◆"));
if (RESTO.telephone) {
  contact.append(e("span", null,
    '<a href="tel:' + RESTO.telephone.replace(/\s/g, "") + '">' + RESTO.telephone + "</a>"));
}
if (contact.childNodes.length) coord.append(contact);
if (RESTO.horaires.length) {
  const hr = e("div", "heures");
  RESTO.horaires.forEach((t, i) => { if (i) hr.append(document.createElement("br")); hr.append(t); });
  coord.append(hr);
}

/* Pied de page */
const infos = document.getElementById("infos");
if (RESTO.telephone) infos.append(e("p", null, 'Réservations au <a href="tel:' + RESTO.telephone.replace(/\s/g, "") + '">' + RESTO.telephone + "</a>"));
document.getElementById("mention").textContent = RESTO.piedDePage;

/* Compteur de visites.
   ------------------------------------------------------------------
   Service : countapi.mileshilliard.com — gratuit, sans compte ni clé.
   La visite est enregistrée au chargement de la page.
   Le chiffre n'apparaît que si l'on appuie sur le petit ours en bas à gauche.
   Ce premier appui annule la visite en cours et mémorise l'appareil : les
   visites suivantes depuis ce navigateur ne seront plus comptées du tout.
   Appui long d'une seconde pour refaire compter cet appareil. */

const jeton = document.getElementById("jeton");
const ligneCompteur = document.getElementById("compteur");
jeton.style.backgroundImage = "url('" + IMAGES.logo + "')";

const CLE_PATRON = "taniere-patron";
const API = "https://countapi.mileshilliard.com/api/v1/";

function memoire(valeur) {
  try {
    if (valeur === undefined) return localStorage.getItem(CLE_PATRON) === "1";
    if (valeur) localStorage.setItem(CLE_PATRON, "1");
    else localStorage.removeItem(CLE_PATRON);
  } catch (err) { /* stockage refusé : on garde la variable en mémoire */ }
  return false;
}

let patron = memoire();
let visites = null;

/* chemin = "hit/clé" (compter), "get/clé" (lire), "set/clé?value=N" (fixer)
   Retour : un nombre, ou "reseau" si l'appel n'a pas pu partir
   (bloqueur de pub, CORS, coupure), ou null si le service a mal répondu. */
async function appel(chemin) {
  let r;
  try {
    r = await fetch(API + chemin);
  } catch (err) {
    return "reseau";
  }
  if (r.status === 404) return 0;        // la clé n'existe pas encore
  if (!r.ok) return null;
  try {
    const n = Number((await r.json()).value);   // l'API renvoie du texte
    return Number.isFinite(n) ? n : null;
  } catch (err) {
    return null;
  }
}

if (RESTO.compteur) {
  appel((patron ? "get/" : "hit/") + RESTO.compteur).then(n => { visites = n; });
}

function estNombre(v) { return typeof v === "number"; }

function afficher(texte) {
  ligneCompteur.innerHTML = texte;
  ligneCompteur.hidden = false;
}

/* ══════════════════════════════════════════════════════════════════
   Cœurs : les clients aiment un plat, le patron voit le classement
   ------------------------------------------------------------------
   Un compteur par plat, sur le même service que le compteur de visites.
   Les scores ne sont jamais montrés aux clients : ils n'apparaissent
   que dans le panneau de l'ours.
   ══════════════════════════════════════════════════════════════════ */
const CLE_AIMES = "taniere-aimes";
const panneau = document.getElementById("classement");

function cleDuPlat(nom) {
  return RESTO.compteur + "_j_" + normaliser(nom)
    .replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40);
}

function mesAimes() {
  try { return new Set(JSON.parse(localStorage.getItem(CLE_AIMES) || "[]")); }
  catch (err) { return new Set(); }
}
function noterAimes(ens) {
  try { localStorage.setItem(CLE_AIMES, JSON.stringify([...ens])); } catch (err) {}
}

const aimes = mesAimes();

document.querySelectorAll(".coeur").forEach(btn => {
  const nom = btn.dataset.plat;
  if (aimes.has(nom)) btn.setAttribute("aria-pressed", "true");

  btn.addEventListener("click", async () => {
    const deja = aimes.has(nom);
    const cle = cleDuPlat(nom);

    /* On bascule tout de suite : l'affichage ne doit pas attendre le réseau */
    if (deja) { aimes.delete(nom); btn.setAttribute("aria-pressed", "false"); }
    else {
      aimes.add(nom);
      btn.setAttribute("aria-pressed", "true");
      btn.classList.remove("bat"); void btn.offsetWidth; btn.classList.add("bat");
    }
    noterAimes(aimes);

    if (deja) {
      const n = await appel("get/" + cle);
      if (estNombre(n)) await appel("set/" + cle + "?value=" + Math.max(0, n - 1));
    } else {
      await appel("hit/" + cle);
    }
  });
});

/* Récupère tous les scores, par petits paquets pour ne pas saturer le service */
async function classement() {
  const noms = [...new Set([...document.querySelectorAll(".coeur")].map(b => b.dataset.plat))];
  const scores = [];
  for (let i = 0; i < noms.length; i += 6) {
    const lot = noms.slice(i, i + 6);
    const res = await Promise.all(lot.map(n => appel("get/" + cleDuPlat(n))));
    lot.forEach((n, j) => { if (estNombre(res[j]) && res[j] > 0) scores.push([n, res[j]]); });
  }
  return scores.sort((a, b) => b[1] - a[1]);
}

function afficherClassement(scores) {
  panneau.innerHTML = "";
  panneau.append(e("h3", null, "Les plats préférés"));
  if (!scores.length) {
    panneau.append(e("p", "vide", "Aucun cœur pour le moment."));
  } else {
    const ol = e("ol");
    scores.slice(0, 12).forEach(([nom, n]) => {
      const li = e("li");
      li.append(e("span", "nom", nom), e("span", "score", n + " ♥"));
      ol.append(li);
    });
    panneau.append(ol);
  }
  panneau.hidden = false;
}

let appuiLong = null;

jeton.addEventListener("pointerdown", () => {
  appuiLong = setTimeout(() => {
    appuiLong = null;
    patron = false;
    memoire(false);
    afficher("Appareil recompté");
  }, 1000);
});

["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
  jeton.addEventListener(ev, () => clearTimeout(appuiLong))
);

jeton.addEventListener("click", async () => {
  if (appuiLong === null) { appuiLong = 0; return; }   // l'appui long vient d'agir
  if (!ligneCompteur.hidden) { ligneCompteur.hidden = true; panneau.hidden = true; return; }

  afficher("…");

  if (!estNombre(visites)) visites = await appel("get/" + RESTO.compteur);

  if (!patron && estNombre(visites)) {        // on retire la visite qu'on vient de générer
    patron = true;
    memoire(true);
    const apres = await appel("set/" + RESTO.compteur + "?value=" + Math.max(0, visites - 1));
    visites = estNombre(apres) ? apres : Math.max(0, visites - 1);
  }

  if (visites === "reseau") { afficher("Appel bloqué par le navigateur"); return; }
  if (!estNombre(visites)) { afficher("Compteur indisponible"); return; }
  afficher("<b>" + visites.toLocaleString("fr-FR") + "</b>&nbsp;visites &nbsp;·&nbsp; hors la vôtre");

  panneau.innerHTML = "";
  panneau.append(e("h3", null, "Les plats préférés"), e("p", "vide", "Comptage en cours…"));
  panneau.hidden = false;
  afficherClassement(await classement());
});

/* Statistiques Cloudflare (chargées seulement si un jeton est renseigné) */
if (RESTO.analytics) {
  const s = document.createElement("script");
  s.type = "module";
  s.src = "https://static.cloudflareinsights.com/beacon.min.js";
  s.setAttribute("data-cf-beacon", JSON.stringify({ token: RESTO.analytics }));
  document.head.appendChild(s);
}

/* Installation sur l'écran d'accueil + consultation hors connexion */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* Apparition + surlignage de la section courante */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) x.target.classList.add("vue"); }), { rootMargin: "0px 0px -8% 0px" });
document.querySelectorAll(".section").forEach(s => io.observe(s));

/* ══════════════════════════════════════════════════════════════════
   Recherche instantanée et filtres
   ══════════════════════════════════════════════════════════════════ */
const champ = document.getElementById("recherche");
const boutonVider = document.getElementById("vider");
const boutonFiltre = document.getElementById("filtre-btn");
const zoneFiltres = document.getElementById("filtres");
const pastille = document.getElementById("pastille");
const ligneResultat = document.getElementById("resultat");

/* Les puces sont construites à partir des étiquettes réellement présentes */
const etiquettes = [...new Set(
  CARTE.flatMap(s => [...(s.plats || []), ...(s.groupes || []).flatMap(g => g.plats)])
       .flatMap(p => p.tags || [])
)];

const actives = new Set();     // étiquettes : végé, suggestion…
const evites = new Set();      // allergènes à exclure

function groupeFiltres(titre) {
  const bloc = e("div", "groupe-filtre");
  bloc.append(e("p", "titre-filtre", titre));
  const rangee = e("div", "rangee-puces");
  bloc.append(rangee);
  zoneFiltres.append(bloc);
  return rangee;
}

if (etiquettes.length) {
  const rangee = groupeFiltres("Préférences");
  etiquettes.forEach(t => {
    const b = e("button", "puce", t === "suggestion" ? "suggestion du chef" : t);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      if (actives.has(t)) actives.delete(t); else actives.add(t);
      b.setAttribute("aria-pressed", actives.has(t) ? "true" : "false");
      filtrer();
    });
    rangee.append(b);
  });
}

/* Allergènes réellement présents dans la table */
const listeAllergenes = [...new Set(Object.values(ALLERGENES).flat())]
  .sort((a, b) => (NOMS_ALLERGENES[a] || a).localeCompare(NOMS_ALLERGENES[b] || b, "fr"));

if (listeAllergenes.length) {
  const rangee = groupeFiltres("Je ne peux pas manger");
  listeAllergenes.forEach(a => {
    const b = e("button", "puce", NOMS_ALLERGENES[a] || a);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      if (evites.has(a)) evites.delete(a); else evites.add(a);
      b.setAttribute("aria-pressed", evites.has(a) ? "true" : "false");
      filtrer();
    });
    rangee.append(b);
  });
  zoneFiltres.append(e("p", "avertissement",
    "Filtre indicatif. Des traces sont possibles, les plats étant préparés dans une cuisine commune. " +
    "Signalez toujours votre allergie à votre serveur avant de commander."));
}

boutonFiltre.addEventListener("click", () => {
  const ouvert = zoneFiltres.hidden;
  zoneFiltres.hidden = !ouvert;
  boutonFiltre.setAttribute("aria-expanded", ouvert ? "true" : "false");
});

champ.addEventListener("input", filtrer);
boutonVider.addEventListener("click", () => { champ.value = ""; champ.focus(); filtrer(); });

function filtrer() {
  const q = normaliser(champ.value.trim());
  const actif = q.length > 0 || actives.size > 0 || evites.size > 0;

  boutonVider.hidden = !champ.value;
  const nbFiltres = actives.size + evites.size;
  pastille.hidden = nbFiltres === 0;
  pastille.textContent = nbFiltres;

  document.querySelectorAll(".vignette, .arbre").forEach(el => { el.style.display = actif ? "none" : ""; });

  let total = 0;

  document.querySelectorAll(".section").forEach(sec => {
    let visibles = 0;

    sec.querySelectorAll(".plat").forEach(el => {
      const texteOk = !q || el.dataset.texte.includes(q);
      const tagsOk = !actives.size || [...actives].every(t => el.dataset.texte.includes(normaliser(t)));
      const listeAl = el.dataset.allergenes.split(" ");
      const alOk = !evites.size || (listeAl[0] !== "?" && ![...evites].some(a => listeAl.includes(a)));
      const ok = texteOk && tagsOk && alOk;
      el.style.display = ok ? "" : "none";
      if (ok) visibles++;
    });

    /* Dans les menus, on filtre ligne par ligne. Les étiquettes ne s'y appliquent pas. */
    const lignes = sec.querySelectorAll(".bloc li");
    if (lignes.length) {
      let gardees = 0;
      lignes.forEach(li => {
        const ok = !actives.size && !evites.size && (!q || li.dataset.texte.includes(q));
        li.style.display = ok ? "" : "none";
        if (ok) gardees++;
      });
      sec.querySelectorAll(".bloc").forEach(b => {
        const reste = [...b.querySelectorAll("li")].some(li => li.style.display !== "none");
        b.style.display = reste ? "" : "none";
      });
      const formule = sec.querySelector(".formule");
      if (formule) formule.style.display = gardees ? "" : "none";
      visibles += gardees;
    }

    /* Un sous-groupe entièrement masqué disparaît avec son titre */
    sec.querySelectorAll(".groupe").forEach(g => {
      const reste = [...g.querySelectorAll(".plat")].some(el => el.style.display !== "none");
      g.style.display = reste ? "" : "none";
    });

    sec.style.display = (!actif || visibles) ? "" : "none";
    total += visibles;

    const lien = document.querySelector('.nav a[href="#' + sec.id + '"]');
    if (lien) lien.parentElement.style.display = sec.style.display === "none" ? "none" : "";
  });

  if (!actif) { ligneResultat.hidden = true; return; }
  ligneResultat.hidden = false;
  const suffixe = evites.size ? " &nbsp;·&nbsp; menus exclus, demandez à votre serveur" : "";
  ligneResultat.innerHTML = total
    ? "<b>" + total + "</b> résultat" + (total > 1 ? "s" : "") + suffixe
    : "Aucun plat ne correspond à cette combinaison.";
}

/* Dégradés du menu selon la position du défilement */
const barreNav = document.querySelector(".nav");
function majDebordement() {
  const reste = nav.scrollWidth - nav.clientWidth;
  barreNav.classList.toggle("deborde-gauche", nav.scrollLeft > 4);
  barreNav.classList.toggle("deborde-droite", reste > 4 && nav.scrollLeft < reste - 4);
}
nav.addEventListener("scroll", majDebordement, { passive: true });
window.addEventListener("resize", majDebordement);
majDebordement();

/* La molette fait défiler le menu horizontalement */
nav.addEventListener("wheel", ev => {
  if (nav.scrollWidth <= nav.clientWidth) return;
  if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
  ev.preventDefault();
  nav.scrollLeft += ev.deltaY;
}, { passive: false });

const liens = [...nav.querySelectorAll("a")];
const actif = new IntersectionObserver(es => {
  es.forEach(x => {
    if (!x.isIntersecting) return;
    liens.forEach(a => {
      const actif = a.getAttribute("href") === "#" + x.target.id;
      a.setAttribute("aria-current", actif ? "true" : "false");
      if (actif && nav.scrollWidth > nav.clientWidth) {
        a.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      }
    });
  });
}, { rootMargin: "-20% 0px -70% 0px" });
document.querySelectorAll(".section").forEach(s => actif.observe(s));
</script>
</body>
