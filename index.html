.hero-branding{
  max-width:920px;
  margin:0 auto;
  padding:24px 22px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
}
.brand-line{
  display:flex;
  align-items:center;
  gap:18px;
  min-width:0;
}
.brand-copy{text-align:left}
.hero-logo{
  flex:0 0 auto;
  width:82px;
  height:82px;
  object-fit:contain;
  margin:0;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));
}
.brand{
  position:relative;
  z-index:1;
  text-shadow:none;
  font:700 clamp(38px,5.6vw,64px) Georgia,serif;
  letter-spacing:.04em;
  line-height:.95;
}
.sub{
  position:relative;
  z-index:1;
  text-shadow:none;
  color:var(--red);
  font-style:italic;
  font-size:22px;
  margin-top:8px;
}
.promo{
  position:relative;
  z-index:1;
  margin:0;
  width:152px;
  height:152px;
  flex:0 0 152px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(145deg,#f3c65e,#cf9328);
  color:#1c120c;
  border:3px solid #fff4df;
  font-weight:900;
  line-height:1.14;
  letter-spacing:.01em;
  padding:14px;
  font-size:14px;
  box-sizing:border-box;
  box-shadow:0 12px 28px #0007;
  text-shadow:0 1px 0 rgba(255,255,255,.28);
  transform:rotate(-4deg);
}
.promo .offerte{display:inline;color:inherit;background:none;padding:0;border-radius:0;text-shadow:inherit;box-shadow:none;}.brand{position:relative;z-index:1;text-shadow:0 3px 18px #000;font:700 clamp(38px,9vw,70px) Georgia,serif;letter-spacing:.04em}.sub{position:relative;z-index:1;text-shadow:0 2px 12px #000;color:var(--red);font-style:italic;font-size:22px}.promo{position:relative;z-index:1;margin:20px auto 0;width:152px;height:152px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#f3c65e,#cf9328);color:#1c120c;border:3px solid #fff4df;font-weight:900;line-height:1.14;letter-spacing:.01em;padding:14px;font-size:14px;box-sizing:border-box;box-shadow:0 16px 38px #0008;text-shadow:0 1px 0 rgba(255,255,255,.28);transform:rotate(-4deg)}.promo .offerte{display:inline;color:inherit;background:none;padding:0;border-radius:0;text-shadow:inherit;box-shadow:none}.bar{position:sticky;top:0;z-index:5;background:#17110eee;backdrop-filter:blur(12px);border-block:1px solid #4a3428;padding:10px}.barin{max-width:920px;margin:auto;display:flex;gap:8px;overflow:auto}.bar input{min-width:210px;flex:1;background:#2b201a;color:white;border:1px solid #5c4435;border-radius:999px;padding:11px 15px}.bar a{white-space:nowrap;text-decoration:none;color:#d9c9b8;padding:9px 12px;border-radius:999px}.bar a:hover{background:#39291f;color:white}main{max-width:920px;margin:auto;padding:12px 12px 70px}.sec{margin:18px 0;padding:22px 20px;border-radius:22px;background:linear-gradient(145deg,#291e18,#1e1713);border:1px solid #49352a;box-shadow:0 18px 45px #0004}.sec h2{margin:0 0 16px;color:#d0594d;font:italic 32px Georgia,serif}.item{padding:10px 0;border-bottom:1px dotted #594338}.top{display:flex;gap:10px;align-items:baseline}.name{font-weight:800;font-size:17px}.dots{flex:1;border-bottom:1px dotted #6a5141}.price{color:var(--gold);font-weight:900;white-space:nowrap}.desc{color:var(--muted);font-size:13px;line-height:1.45;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.box{padding:14px;border-radius:15px;background:#2a1f19;border:1px solid #503b30}.box h3{color:var(--gold);margin:0 0 8px}.pizza-note{color:var(--gold);font-weight:800;margin-bottom:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.sec{padding:18px 15px}}
.formule-prices{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.formule-price{background:#34251d;border:1px solid #624637;border-radius:13px;padding:9px 12px}
.formule-price strong{color:var(--gold);display:block;font-size:18px;margin-top:3px}
.formule-cond{color:var(--muted);font-size:14px;margin-top:-10px}
.formule-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.formule-col{background:#2a1f19;border:1px solid #503b30;border-radius:15px;padding:14px}
.formule-col h3{margin:0 0 10px;color:var(--gold);font-size:17px}
.formule-choice{padding:7px 0;border-bottom:1px dotted #594338;font-size:14px;line-height:1.35}.formule-choice>strong{font-weight:800}.formule-ingredients{font-weight:400;color:var(--muted);margin-top:3px}
@media(max-width:760px){.formule-cols{grid-template-columns:1fr}}
/* Les descriptions et ingrédients restent en graisse normale */
.desc,.description,.ingredients,.item-desc,.dish-desc,.plat-desc{font-weight:400!important}

/* Anciennes photos de plats restaurées depuis le premier index */
.old-photo-gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin:4px 0 20px;
}
.old-photo-card{
  margin:0;
  padding:7px;
  border-radius:16px;
  background:#1b1411;
  border:1px solid rgba(217,166,74,.30);
  box-shadow:0 10px 24px rgba(0,0,0,.28);
  overflow:hidden;

const OLD_GALLERIES={"entrees": [["camembert", "Camembert rôti"], ["burrata", "Tomates burrata"]], "salades": [["italienne", "Salade italienne"], ["salade", "Salade chèvre & saumon fumé"]], "plats": [["poulet", "½ poulet français rôti"], ["saumon", "Pavé de saumon rôti"], ["jacques", "Brochette de Saint-Jacques"], ["carpaccio", "Carpaccio de bœuf & burrata"]], "desserts": [["cheesecake", "Cheesecake"]]};
const main=document.getElementById('menu');
Object.entries(FORMULES).forEach(([titre,f])=>{
 let sec=document.createElement('section'); sec.className='sec'; sec.id=f.id;
 sec.innerHTML='<h2>'+titre+'</h2><div class="formule-cond">'+f.condition+'</div>'+
 '<div class="formule-prices">'+f.tarifs.map(t=>'<div class="formule-price">'+t[0]+'<strong>'+t[1]+'</strong></div>').join('')+'</div>'+
 '<div class="formule-cols">'+f.groupes.map(g=>'<div class="formule-col"><h3>'+g[0]+'</h3>'+g[1].map(x=>{const p=x.split('|');return '<div class="formule-choice"><strong>'+p[0]+'</strong>'+(p[1]?'<div class="formule-ingredients">'+p[1]+'</div>':'')+'</div>'}).join('')+'</div>').join('')+'</div>';
 main.append(sec);
});

Object.entries(DATA).forEach(([cat,rows])=>{let sec=document.createElement('section');sec.className='sec';sec.id=cat.startsWith('Pizzas')?'pizzas':slug(cat);sec.innerHTML='<h2>'+cat+'</h2>'+(cat.startsWith('Pizzas')?'<div class="pizza-note">🍕 À emporter · 3 pizzas achetées = 1 pizza offerte</div>':'');
const galleryKey = sec.id;
if (OLD_GALLERIES[galleryKey]) {
  const gal=document.createElement('div');
  gal.className='old-photo-gallery';
  gal.innerHTML=OLD_GALLERIES[galleryKey].filter(p=>OLD_PHOTOS[p[0]]).map(p=>
    '<figure class="old-photo-card"><img loading="lazy" src="'+OLD_PHOTOS[p[0]]+'" alt="'+p[1]+'"><figcaption>'+p[1]+'</figcaption></figure>'
  ).join('');
  sec.append(gal);
}rows.forEach(r=>sec.insertAdjacentHTML('beforeend',`<div class="item"><div class="top"><span class="name">${r[0]}</span><span class="dots"></span><span class="price">${euro(r[2])}</span></div>${r[1]?'<div class="desc">'+r[1]+'</div>':''}</div>`));main.append(sec)});
let g=document.createElement('section');g.className='sec';g.innerHTML='<h2>Garnitures & sauces</h2><div class="grid"><div class="box"><h3>Garnitures</h3><div class="desc">Frites<br>Riz<br>Purée<br>Haricots verts<br>Salade</div></div><div class="box"><h3>Sauces</h3><div class="desc">Poivre<br>Béarnaise<br>Roquefort<br>Barbecue</div></div></div>';main.insertBefore(g,document.getElementById('pizzas'));
let b=document.createElement('section');b.className='sec';b.id='boissons';b.innerHTML='<h2>Boissons & Le Cellier</h2><div class="grid">'+DRINKS.map(x=>`<div class="box"><h3>${x[0]}</h3><div class="desc">${x[1].replaceAll('|','<br>')}</div></div>`).join('')+'</div>';main.append(b);
document.getElementById('q').oninput=e=>{let s=slug(e.target.value);document.querySelectorAll('.item').forEach(x=>x.style.display=slug(x.innerText).includes(s)?'block':'none')};

<script>
(function(){
  const CLE = "lataniere_lanester_carte";
  const CLE_PATRON = "taniere-patron";
  const API = "https://countapi.mileshilliard.com/api/v1/";
  const ours = document.getElementById("ours-visites");
  const ligne = document.getElementById("compteur-visites");
  let visites = null, visitesJour = null;

  function patron(val){
    try{
      if(val === undefined) return localStorage.getItem(CLE_PATRON) === "1";
      if(val) localStorage.setItem(CLE_PATRON,"1");
      else localStorage.removeItem(CLE_PATRON);
    }catch(e){}
    return false;
  }
  let estPatron = patron();

  function cleJour(){
    const p = new Intl.DateTimeFormat("en-GB",{
      timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    const v=t=>(p.find(x=>x.type===t)||{}).value;
    return CLE+"_d_"+v("year")+v("month")+v("day");
  }
  async function appel(path){
    try{
      const r=await fetch(API+path);
      if(r.status===404) return 0;
      if(!r.ok) return null;
      const n=Number((await r.json()).value);
      return Number.isFinite(n)?n:null;
    }catch(e){return "reseau";}
  }
  const estNombre=v=>typeof v==="number";

  const verbe=estPatron?"get/":"hit/";
  appel(verbe+CLE).then(n=>visites=n);
  appel(verbe+cleJour()).then(n=>visitesJour=n);

  let longPress=null;
  ours.addEventListener("pointerdown",()=>{
    longPress=setTimeout(()=>{
      longPress=null; estPatron=false; patron(false);
      ligne.innerHTML="Appareil recompté";
      ligne.hidden=false;
    },1000);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>
    ours.addEventListener(ev,()=>{ if(longPress!==null) clearTimeout(longPress); })
  );

  ours.addEventListener("click",async()=>{
    if(longPress===null){longPress=0;return;}
    if(!ligne.hidden){ligne.hidden=true;return;}
    ligne.innerHTML="…"; ligne.hidden=false;

    if(!estNombre(visites)) visites=await appel("get/"+CLE);
    if(!estNombre(visitesJour)) visitesJour=await appel("get/"+cleJour());

    if(!estPatron && estNombre(visites)){
      estPatron=true; patron(true);
      const cible=Math.max(0,visites-1);
      const a=await appel("set/"+CLE+"?value="+cible);
      visites=estNombre(a)?a:cible;
      if(estNombre(visitesJour)){
        const cj=Math.max(0,visitesJour-1);
        const aj=await appel("set/"+cleJour()+"?value="+cj);
        visitesJour=estNombre(aj)?aj:cj;
      }
    }

    if(visites==="reseau"){ligne.textContent="Appel bloqué par le navigateur";return;}
    if(!estNombre(visites)){ligne.textContent="Compteur indisponible";return;}
    ligne.innerHTML="<b>"+visites.toLocaleString("fr-FR")+"</b> au total"+
      (estNombre(visitesJour)?" &nbsp;·&nbsp; <b>"+visitesJour.toLocaleString("fr-FR")+"</b> aujourd’hui":"");
  });
})();
</script>


<script>
(function () {
  const el = document.getElementById("date-carte");
  if (!el) return;

  function deux(n){ return String(n).padStart(2,"0"); }

  // document.lastModified se met à jour lorsque le fichier index est modifié
  // puis remis en ligne. Si l'information n'est pas exploitable, on garde
  // la date de la session courante comme secours.
  let d = new Date(document.lastModified);
  if (isNaN(d.getTime())) d = new Date();

  const texte = deux(d.getDate()) + "/" + deux(d.getMonth()+1) + "/" + String(d.getFullYear()).slice(-2);
  el.textContent = "Nouvelle carte (du " + texte + ")";
})();
</script>
